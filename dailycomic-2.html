<title>日常漫画</title>

<style>

body {
  background: #ffffff;
  color: #35200F;
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 40px 20px;
}

h1 {
  margin-bottom: 50px;
}

#comic-list {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.comic-item {
  width: 220px;
  margin-bottom: 50px;
  text-align: center;
}

.comic-item img {
  width: 220px;
  height: 120px;
  object-fit: cover;
  border-radius: 20px;

  box-shadow:
    0 0 15px #FDE8DF,
    0 0 30px #FDE8DF;
}

.comic-item a {
  color: #35200F;
  text-decoration: none;
}

.comic-item a:visited {
  color: #999999;
}

.comic-date {
  font-size: 14px;
  margin-top: 12px;
}

.comic-title {
  font-size: 22px;
  font-weight: bold;
  margin-top: 5px;
}

.comic-title a {
  color: #35200F;
  text-decoration: none;
}

.comic-title a:visited {
  color: #999999;
}

#pagination {
  margin-top: 60px;
  text-align: center;
}

#pagination a {
  color: #35200F;
  text-decoration: none;
  font-size: 18px;
  margin: 0 15px;
}

#pagination a:visited {
  color: #35200F;
}

.category {
  margin-top: 40px;
}

.category a {
  color: #35200F;
  text-decoration: none;
  font-size: 18px;
}

.category a:visited {
  color: #35200F;
}

</style>

</body>
</html>
