<title>メタバース</title>

<style>

body{
  margin:0;
  padding:40px 20px;
  background:#ffffff;
  color:#35200F;
  font-family:sans-serif;
  text-align:center;
}

.comic-list{
  max-width:800px;
  margin:0 auto;
}

.comic-card{
  display:block;
  text-decoration:none;
  color:#35200F;
  text-align:center;
  margin-bottom:50px;
}

.comic-card img{
  display:block;
  width:220px;
  height:120px;

  object-fit:cover;
  object-position:center;

  border-radius:20px;

  margin:0 auto;

  box-shadow:
    0 0 12px #CFEFFF,
    0 0 24px #CFEFFF,
    0 0 36px rgba(207,239,255,0.8);
}

.date{
  margin-top:8px;
  font-size:14px;
  text-align:center;
}

.title{
  margin-top:2px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
}

.pagination{
  text-align:center;
  margin-top:60px;
}

.pagination a{
  color:#35200F;
  text-decoration:none;
  font-size:18px;
}

</style>
</head>

<body>

<div id="comic-list" class="comic-list"></div>

<div id="pagination" class="pagination"></div>
