ベータページ

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>β</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;
  padding:40px 20px;

  background:#FFF9FA;

  text-align:center;

  font-family:sans-serif;

  overflow-x:hidden;

  color:#35200F;

}

/* 背景 */

.bg{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0.12;

  z-index:-1;

}

/* キャラ画像 */

.chara{

  width:220px;

  margin-top:40px;

}

/* YouTube */

.youtube{

  width:90%;
  max-width:800px;

  aspect-ratio:16/9;

  margin-top:40px;

  border:none;

  border-radius:30px;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.12);

}

/* 戻る */

.back{

  display:inline-block;

  margin-top:60px;

  color:#35200F;

  text-decoration:none;

  font-size:22px;

  transition:0.2s;

}

.back:hover{

  opacity:0.6;

  transform:scale(1.05);

}

/* スマホ */

@media screen and (max-width:800px){

  .chara{

    width:140px;

  }

  .youtube{

    width:100%;

  }

}

</style>

</head>

<body>

<!-- 背景 -->

<img src="betaback.png" class="bg">

<!-- キャラクター -->

<img src="IMG_6368.png" class="chara">

<!-- YouTube -->

<iframe
class="youtube"
src="https://www.youtube.com/embed/gzY1akAO9I?"
title="YouTube video"
allowfullscreen>
</iframe>

<br>

<!-- 戻る -->

<a href="index.html" class="back">

← Back

</a>

</body>
</html>
