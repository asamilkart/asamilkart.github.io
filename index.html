<!DOCTYPE html>

<meta charset="UTF-8">
<title>Asamilk World</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
  background:#ffffff;
  color:#35200F;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding:40px;
}

.topimg{
  width:100%;
  max-width:900px;
  border-radius:25px;
  margin-top:30px;
  border:6px solid #FDE8DF;
}

.comicimg{
  width:100%;
  max-width:700px;
  border-radius:20px;
  margin-top:20px;
  border:6px solid #FDE8DF;
  transition:0.3s;
}

.comicimg:hover{
  transform:scale(1.02);
}

h2{
  margin-top:70px;
  margin-bottom:30px;
  font-size:32px;
}

.charas{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:30px;
  margin-top:30px;
}

.charaimg{
  width:100%;
  max-width:500px;
  border-radius:25px;
  border:6px solid #FDE8DF;
  transition:0.3s;
}

.charaimg:hover{
  transform:scale(1.02);
}

.sns{
  margin-top:70px;
  padding:25px;
  border:4px solid #FDE8DF;
  border-radius:25px;
  display:inline-block;
}

.sns a{
  color:#35200F;
  font-size:42px;
  margin:15px;
  text-decoration:none;
  transition:0.2s;
}

.sns a:hover{
  opacity:0.6;
}

@media screen and (max-width:700px){

  body{
    padding:20px;
  }

  h2{
    font-size:26px;
  }

  .sns a{
    font-size:34px;
    margin:10px;
  }

}

</style>

</head>
