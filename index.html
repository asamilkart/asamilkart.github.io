<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Asamilk World</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
  background:#FFFBFB;
  color:#35200F;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding:40px;
  overflow-x:hidden;
}

/* トップ画像 */

.topimg{
  width:100%;
  max-width:900px;
  border-radius:30px;
  margin-top:30px;
}

/* Comic */

.comicimg{
  width:100%;
  max-width:700px;
  border-radius:30px;
  margin-top:20px;
  transition:0.3s;
}

.comicimg:hover{
  transform:scale(1.02);
}

/* タイトル */

h2{
  margin-top:90px;
  margin-bottom:50px;
  font-size:38px;
  font-weight:normal;
  letter-spacing:2px;
}

/* キャラクター円 */

.wheel{
  position:relative;
  width:620px;
  height:620px;
  margin:auto;

  animation:spin 45s linear infinite;
}

/* 背景の大きい円 */

.wheelbg{
  position:absolute;

  width:620px;
  height:620px;

  top:0;
  left:0;

  opacity:0.18;

  pointer-events:none;
}

/* キャラクター */

.small{
  width:120px;
  position:absolute;

  transition:0.3s;
  cursor:pointer;

  animation:reverseSpin 45s linear infinite;

  z-index:2;
}

.small:hover{
  transform:
    scale(1.08)
    rotate(8deg);
}

/* 円配置 */

.s1{
  top:0px;
  left:250px;
}

.s2{
  top:120px;
  left:470px;
}

.s3{
  top:370px;
  left:470px;
}

.s4{
  top:500px;
  left:250px;
}

.s5{
  top:370px;
  left:30px;
}

.s6{
  top:120px;
  left:30px;
}

/* 円回転 */

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* キャラ逆回転 */

@keyframes reverseSpin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(-360deg);
  }

}

/* SNS */

.sns{
  margin-top:90px;
  padding:25px;
  border:4px solid #FDE8DF;
  border-radius:30px;
  display:inline-block;
  background:#ffffffaa;
}

.sns a{
  color:#35200F;
  font-size:42px;
  margin:15px;
  text-decoration:none;
  transition:0.2s;
  display:inline-block;
}

.sns a:hover{
  opacity:0.6;
  transform:
    scale(1.1)
    rotate(-8deg);
}

/* スマホ */

@media screen and (max-width:800px){

  body{
    padding:20px;
  }

  h2{
    font-size:28px;
  }

  .wheel{
    width:340px;
    height:340px;
  }

  .wheelbg{
    width:340px;
    height:340px;
  }

  .small{
    width:72px;
  }

  .s1{
    top:0px;
    left:134px;
  }

  .s2{
    top:65px;
    left:255px;
  }

  .s3{
    top:205px;
    left:255px;
  }

  .s4{
    top:268px;
    left:134px;
  }

  .s5{
    top:205px;
    left:13px;
  }

  .s6{
    top:65px;
    left:13px;
  }

  .sns a{
    font-size:34px;
    margin:10px;
  }

}

</style>

</head>

<body>
