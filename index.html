<!DOCTYPE html>

<style>

body{
  background:#000000;
  color:#ffffff;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding:40px;
  overflow-x:hidden;
}

/* トップ画像 */

.topimg{
  width:100%;
  max-width:900px;
  border-radius:30px;
  margin-top:30px;
}

/* 見出し */

h2{
  margin-top:100px;
  margin-bottom:40px;
  font-size:40px;
  font-weight:normal;
  letter-spacing:3px;
  color:#FDE8DF;
}

/* キャラクター円 */

.wheel{
  position:relative;
  width:700px;
  height:700px;
  margin:auto;
  animation:spin 40s linear infinite;
}

/* 背景円 */

.wheel::before{
  content:"";
  position:absolute;
  width:580px;
  height:580px;
  border:4px dashed #FDE8DF;
  border-radius:50%;
  top:60px;
  left:60px;
  opacity:0.5;
}

/* キャラ画像 */

.small{
  width:130px;
  position:absolute;
  transition:0.4s;
  cursor:pointer;

  animation:reverseSpin 40s linear infinite;
}

/* ホバー */

.small:hover{
  transform:
    scale(1.1)
    rotate(8deg);
}

/* 配置 */

.s1{
  top:0px;
  left:285px;
}

.s2{
  top:120px;
  left:520px;
}

.s3{
  top:420px;
  left:520px;
}

.s4{
  top:570px;
  left:285px;
}

.s5{
  top:420px;
  left:40px;
}

.s6{
  top:120px;
  left:40px;
}

/* 回転 */

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* キャラは逆回転 */

@keyframes reverseSpin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(-360deg);
  }

}

/* Comic */

.comicimg{
  width:100%;
  max-width:700px;
  border-radius:30px;
  margin-top:20px;
  transition:0.3s;
}

.comicimg:hover{
  transform:scale(1.03);
}

/* SNS */

.sns{
  margin-top:90px;
  padding:25px;
  border:2px solid #FDE8DF;
  border-radius:999px;
  display:inline-block;
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(10px);
}

.sns a{
  color:#ffffff;
  font-size:42px;
  margin:15px;
  text-decoration:none;
  transition:0.3s;
  display:inline-block;
}

.sns a:hover{
  opacity:0.7;
  transform:
    scale(1.15)
    rotate(-8deg);
}

/* スマホ */

@media screen and (max-width:800px){

  body{
    padding:20px;
  }

  h2{
    font-size:28px;
  }

  .wheel{
    width:340px;
    height:340px;
  }

  .wheel::before{
    width:280px;
    height:280px;
    top:30px;
    left:30px;
  }

  .small{
    width:70px;
  }

  .s1{
    top:0px;
    left:135px;
  }

  .s2{
    top:65px;
    left:255px;
  }

  .s3{
    top:205px;
    left:255px;
  }

  .s4{
    top:270px;
    left:135px;
  }

  .s5{
    top:205px;
    left:15px;
  }

  .s6{
    top:65px;
    left:15px;
  }

  .sns a{
    font-size:32px;
    margin:10px;
  }

}

</style>

</head>
