<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Asamilk World</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
  background:#FFFBFB;
  color:#35200F;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding:40px;
  overflow-x:hidden;
}

/* トップ画像 */

.topimg{
  width:100%;
  max-width:900px;
  border-radius:30px;
  margin-top:30px;
}

/* Comic */

.comicimg{
  width:100%;
  max-width:700px;
  border-radius:30px;
  margin-top:20px;
  transition:0.3s;
}

.comicimg:hover{
  transform:scale(1.02);
}

/* タイトル */

h2{
  margin-top:80px;
  margin-bottom:40px;
  font-size:38px;
  font-weight:normal;
  letter-spacing:2px;
}

/* キャラクター円 */

.wheel{
  position:relative;
  width:520px;
  height:520px;
  margin:auto;

  animation:spin 40s linear infinite;
}

/* 背景円画像 */

.wheelbg{
  position:absolute;
  width:400px;
  height:400px;

  top:60px;
  left:60px;

  opacity:0.9;
}

/* キャラクター */

.small{
  width:110px;
  position:absolute;

  transition:0.3s;
  cursor:pointer;

  animation:reverseSpin 40s linear infinite;
}

.small:hover{
  transform:
    scale(1.08)
    rotate(8deg);
}

/* 円配置 */

.s1{
  top:-10px;
  left:205px;
}

.s2{
  top:100px;
  left:390px;
}

.s3{
  top:310px;
  left:390px;
}

.s4{
  top:430px;
  left:205px;
}

.s5{
  top:310px;
  left:20px;
}

.s6{
  top:100px;
  left:20px;
}

/* 円回転 */

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* キャラ逆回転 */

@keyframes reverseSpin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(-360deg);
  }

}

/* SNS */

.sns{
  margin-top:80px;
  padding:25px;
  border:4px solid #FDE8DF;
  border-radius:30px;
  display:inline-block;
}

.sns a{
  color:#35200F;
  font-size:42px;
  margin:15px;
  text-decoration:none;
  transition:0.2s;
  display:inline-block;
}

.sns a:hover{
  opacity:0.6;
  transform:
    scale(1.1)
    rotate(-8deg);
}

/* スマホ */

@media screen and (max-width:800px){

  body{
    padding:20px;
  }

  h2{
    font-size:28px;
  }

  .wheel{
    width:320px;
    height:320px;
  }

  .wheelbg{
    width:240px;
    height:240px;

    top:40px;
    left:40px;
  }

  .small{
    width:70px;
  }

  .s1{
    top:-10px;
    left:125px;
  }

  .s2{
    top:60px;
    left:240px;
  }

  .s3{
    top:190px;
    left:240px;
  }

  .s4{
    top:260px;
    left:125px;
  }

  .s5{
    top:190px;
    left:10px;
  }

  .s6{
    top:60px;
    left:10px;
  }

  .sns a{
    font-size:34px;
    margin:10px;
  }

}

</style>

</head>

<body>
