<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Asamilk World</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
  background:#FFFBFB;
  color:#35200F;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding:40px;
  overflow-x:hidden;
}

.topimg{
  width:100%;
  max-width:900px;
  border-radius:30px;
  margin-top:30px;
}

.comicimg{
  width:100%;
  max-width:700px;
  border-radius:30px;
  margin-top:20px;
  transition:0.3s;
}

.comicimg:hover{
  transform:scale(1.02);
}

h2{
  margin-top:80px;
  margin-bottom:40px;
  font-size:38px;
  font-weight:normal;
  letter-spacing:2px;
}

/* キャラクター円 */

.wheel{
  position:relative;
  width:700px;
  height:700px;
  margin:auto;
}

.wheel::before{
  content:"";
  position:absolute;
  width:580px;
  height:580px;
  border:4px dashed #FDE8DF;
  border-radius:50%;
  top:60px;
  left:60px;
}

/* 中央 */

.center{
  width:260px;
  position:absolute;
  top:220px;
  left:220px;
  z-index:2;
  transition:0.3s;
  cursor:pointer;
}

.center:hover{
  transform:
    scale(1.05)
    rotate(-4deg);
}

/* 周囲 */

.small{
  width:130px;
  position:absolute;
  transition:0.3s;
  cursor:pointer;
}

.small:hover{
  transform:
    scale(1.08)
    rotate(6deg);
}

/* 配置 */

.s1{
  top:0px;
  left:285px;
}

.s2{
  top:140px;
  left:520px;
}

.s3{
  top:430px;
  left:520px;
}

.s4{
  top:570px;
  left:285px;
}

.s5{
  top:430px;
  left:40px;
}

/* SNS */

.sns{
  margin-top:80px;
  padding:25px;
  border:4px solid #FDE8DF;
  border-radius:30px;
  display:inline-block;
}

.sns a{
  color:#35200F;
  font-size:42px;
  margin:15px;
  text-decoration:none;
  transition:0.2s;
}

.sns a:hover{
  opacity:0.6;
  transform:scale(1.1);
}

/* スマホ */

@media screen and (max-width:800px){

  body{
    padding:20px;
  }

  .wheel{
    width:340px;
    height:340px;
  }

  .wheel::before{
    width:280px;
    height:280px;
    top:30px;
    left:30px;
  }

  .center{
    width:140px;
    top:100px;
    left:100px;
  }

  .small{
    width:70px;
  }

  .s1{
    top:0px;
    left:135px;
  }

  .s2{
    top:65px;
    left:255px;
  }

  .s3{
    top:205px;
    left:255px;
  }

  .s4{
    top:270px;
    left:135px;
  }

  .s5{
    top:205px;
    left:15px;
  }

  h2{
    font-size:28px;
  }

  .sns a{
    font-size:34px;
    margin:10px;
  }

}

</style>

</head>

<body>

<img src="top.PNG" class="topimg">

<h2>Character</h2>

<div class="wheel">

  <!-- 中央 -->

  <img src="hamuko.png" class="center">

  <img src="ringo.png" class="small s1">

  <img src="sakuranbou.png" class="small s2">

  <img src="α.png" class="small s3">

  <img src="β.png" class="small s4">

  <img src="mokumoku.png" class="small s5">

</div>
