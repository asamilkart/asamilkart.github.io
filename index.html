<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asamilk World</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  box-sizing:border-box;
}

body{
  background:#FFFBFB;
  color:#35200F;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding:40px 20px;
  overflow-x:hidden;
}

/* 全体中央 */

main{
  width:100%;
  max-width:1100px;
  margin:auto;
}

/* メイン画像 */

.topimg{
  width:100%;
  max-width:900px;

  border-radius:30px;

  display:block;

  margin:auto;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

/* 漫画＋Youtube */

.contentbox{

  display:flex;

  justify-content:center;

  align-items:flex-start;

  gap:30px;

  margin-top:40px;

  flex-wrap:wrap;

}

/* 漫画画像 */

.comicimg{
  width:100%;
  max-width:420px;

  border-radius:30px;

  transition:0.3s;

  border:5px solid #FDE8DF;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.08);

  display:block;
}

.comicimg:hover{

  transform:
    scale(1.03)
    rotate(-1deg);

}

/* YouTube */

.youtubebox{

  width:100%;
  max-width:500px;

}

.youtube{

  width:100%;

  aspect-ratio:16/9;

  border:none;

  border-radius:30px;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.08);

}

/* Character全体 */

.characterwrap{

  position:relative;

  width:620px;
  height:620px;

  margin:auto;
  margin-top:60px;

}

/* heart背景 */

.wheelbg{

  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  opacity:0.18;

  pointer-events:none;

  z-index:1;

}

/* 回転部分 */

.wheel{

  position:absolute;

  inset:0;

  animation:spin 45s linear infinite;

}

/* キャラリンク */

.charalink{

  position:absolute;

  display:block;

  z-index:2;

}

/* キャラクター */

.small{

  width:120px;

  cursor:pointer;

  animation:reverseSpin 45s linear infinite;

  z-index:2;

  display:block;

}

/* キュルン */

.small.clicked{

  animation:
    reverseSpin 45s linear infinite,
    kyurun 0.5s ease;

}

/* 円配置 */

.s1{
  top:0px;
  left:250px;
}

.s2{
  top:120px;
  left:470px;
}

.s3{
  top:370px;
  left:470px;
}

.s4{
  top:500px;
  left:250px;
}

.s5{
  top:370px;
  left:30px;
}

.s6{
  top:120px;
  left:30px;
}

/* 円回転 */

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* キャラ逆回転 */

@keyframes reverseSpin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(-360deg);
  }

}

/* キュルン */

@keyframes kyurun{

  0%{
    transform:rotate(0deg);
  }

  100%{
    transform:rotate(360deg);
  }

}

/* SNS */

.sns{
  margin-top:90px;
}

.sns a{
  color:#35200F;
  font-size:42px;
  margin:18px;
  text-decoration:none;
  transition:0.25s;
  display:inline-block;
}

.sns a:hover{
  opacity:0.6;
  transform:
    scale(1.1)
    rotate(-8deg);
}

/* スマホ */

@media screen and (max-width:800px){

  body{
    padding:20px 10px;
  }

  .contentbox{
    gap:20px;
  }

  .comicimg{
    max-width:100%;
  }

  .youtubebox{
    max-width:100%;
  }

  .characterwrap{
    width:340px;
    height:340px;
  }

  .wheelbg{
    width:280px;
  }

  .small{
    width:72px;
  }

  .s1{
    top:0px;
    left:134px;
  }

  .s2{
    top:65px;
    left:255px;
  }

  .s3{
    top:205px;
    left:255px;
  }

  .s4{
    top:268px;
    left:134px;
  }

  .s5{
    top:205px;
    left:13px;
  }

  .s6{
    top:65px;
    left:13px;
  }

  .sns a{
    font-size:34px;
    margin:10px;
  }

}

</style>

</head>

<body>

<main>

<!-- メイン画像 -->

<img src="top.PNG" class="topimg">

<!-- 漫画＋Youtube -->

<div class="contentbox">

  <!-- 漫画リンク -->

  <a href="comic.html">
    <img src="topday.png" class="comicimg">
  </a>

  <!-- YouTube -->

  <div class="youtubebox">

    <iframe
      class="youtube"
      src="https://www.youtube.com/embed/videoseries?list=PLtDU7MZ79avmn4ffGvj2qb0chWxiazdLH&si=8otA76k0RvQHr-OG"
      title="YouTube playlist"
      allowfullscreen>
    </iframe>

  </div>

</div>

<!-- キャラクター -->

<div class="characterwrap">

  <!-- heart背景 -->

  <img src="heart.png" class="wheelbg">

  <!-- 回転 -->

  <div class="wheel">

    <a href="hamuko.html" class="charalink s1">
      <img src="hamuko.png" class="small">
    </a>

    <a href="ringo.html" class="charalink s2">
      <img src="IMG_6365.png" class="small">
    </a>

    <a href="sakuranbou.html" class="charalink s3">
      <img src="sakuranbou.png" class="small">
    </a>

    <a href="chara4.html" class="charalink s4">
      <img src="IMG_6367.png" class="small">
    </a>

    <a href="beta.html" class="charalink s5">
      <img src="IMG_6368.png" class="small">
    </a>

    <a href="chara6.html" class="charalink s6">
      <img src="IMG_6361.png" class="small">
    </a>

  </div>

</div>

<!-- SNS -->

<div class="sns">

<a href="https://asamilkart.booth.pm" target="_blank">
<i class="fa-solid fa-store"></i>
</a>

<a href="https://youtube.com/@asamilkart" target="_blank">
<i class="fa-brands fa-youtube"></i>
</a>

<a href="https://www.tiktok.com/@asamilkart" target="_blank">
<i class="fa-brands fa-tiktok"></i>
</a>

<a href="https://twitter.com/asamilkart" target="_blank">
<i class="fa-brands fa-x-twitter"></i>
</a>

<a href="https://www.instagram.com/asamilkart" target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a href="https://www.threads.net/@asamilkart" target="_blank">
<i class="fa-brands fa-threads"></i>
</a>

<a href="https://cluster.mu/u/asamilkart" target="_blank">
<i class="fa-solid fa-cube"></i>
</a>

</div>

</main>

<script>

const links = document.querySelectorAll('.charalink');

links.forEach((link)=>{

  link.addEventListener('click',(e)=>{

    e.preventDefault();

    const img = link.querySelector('.small');

    img.classList.remove('clicked');

    void img.offsetWidth;

    img.classList.add('clicked');

    const target = link.getAttribute('href');

    setTimeout(()=>{

      window.location.href = target;

    },400);

  });

});

</script>

</body>
</html>
