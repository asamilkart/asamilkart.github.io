<body>

<div class="pagination">

  <a id="previousPage" href="#">前ページ&gt;</a>

  <br><br>

  <a href="comic.html">&lt;&lt;カテゴリに戻る</a>

  <br><br>

  <a href="index.html">TOP</a>

</div>


<script>

const comics = document.querySelectorAll(".comic-card");

const perPage = 7;

const params = new URLSearchParams(window.location.search);

let page = parseInt(params.get("page")) || 1;

if(page < 1){
  page = 1;
}

const totalPages = Math.ceil(comics.length / perPage);

if(page > totalPages){
  page = totalPages;
}


// 今のページに表示する作品だけ表示

comics.forEach(function(comic, index){

  const start = (page - 1) * perPage;
  const end = start + perPage;

  if(index >= start && index < end){
    comic.style.display = "block";
  }else{
    comic.style.display = "none";
  }

});


// 前ページボタン

const previousPage = document.getElementById("previousPage");

if(page < totalPages){

  previousPage.style.display = "inline";

  previousPage.href = "dailycomic.html?page=" + (page + 1);

}else{

  previousPage.style.display = "none";

}

</script>

</body>
