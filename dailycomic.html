<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>日常</title>

<style>
body{
  margin:0;
  padding:40px 20px;
  background:#ffffff;
  color:#35200F;
  font-family:sans-serif;
}

.comic-list{
  max-width:800px;
  margin:auto;
}

.comic-card{
  display:block;
  text-decoration:none;
  color:#35200F;
  text-align:center;
  margin-bottom:50px;
}

.comic-card img{
  width:220px;
  height:120px;
  object-fit:cover;
  object-position:center;
  border-radius:20px;

  box-shadow:
    0 0 12px #FDE8DF,
    0 0 24px #FDE8DF,
    0 0 36px rgba(253,232,223,0.7);
}

.date{
  margin-top:8px;
  font-size:14px;
}

.title{
  margin-top:2px;
  font-size:22px;
  font-weight:bold;
}

.pagination{
  text-align:center;
  margin-top:60px;
}

.pagination a{
  color:#35200F;
  text-decoration:none;
  font-size:18px;
}
</style>
</head>

<body>

<div class="comic-list" id="comicList"></div>

<div class="pagination" id="pagination"></div>


<script src="comics.js"></script>

<script>

const perPage = 7;

const pageNumber = 1;

const list = document.getElementById("comicList");

const start = (pageNumber - 1) * perPage;
const end = start + perPage;

comics.slice(start, end).forEach(function(comic){

  list.innerHTML += `
    <a class="comic-card" href="${comic.page}">
      <img src="${comic.image}" alt="">
      <div class="date">${comic.date}</div>
      <div class="title">${comic.title}</div>
    </a>
  `;

});


const totalPages = Math.ceil(comics.length / perPage);

const pagination = document.getElementById("pagination");


if(totalPages > 1){

  pagination.innerHTML +=
    '<a href="dailycomic-2.html">前ページ&gt;</a><br><br>';

}


pagination.innerHTML +=
  '<a href="comic.html">&lt;&lt;カテゴリに戻る</a>' +
  '<br><br>' +
  '<a href="index.html">TOP</a>';

</script>

</body>
</html>
